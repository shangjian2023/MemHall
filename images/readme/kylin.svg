<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617" viewBox="0 0 1200 617" role="img" aria-labelledby="title"><title id="title">为 openKylin 的日常使用设计</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8592a7"/></marker></defs><rect width="1200" height="617" rx="24" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="34" fill="#23304a" font-weight="700" text-anchor="start">为 openKylin 的日常使用设计</text><text x="42" y="100" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">发现环境、发起评测、收到通知、打开结果。</text><rect x="42" y="137" width="356" height="214" rx="22" fill="#edf2ff" stroke="none"/><g transform="translate(64 159)" fill="none" stroke="#5264ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="13"/><path d="m31 31 11 11M15 21h12"/></g><text x="126" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">本机智能体探测</text><text x="66" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">检查命令与配置线索</text><text x="66" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">匹配可用评测适配器</text><rect x="422" y="137" width="356" height="214" rx="22" fill="#e9f7f2" stroke="none"/><g transform="translate(444 159)" fill="none" stroke="#22836f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 33h28l-4-6V19a10 10 0 0 0-20 0v8ZM20 40h8M24 5v4"/></g><text x="506" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">UKUI 桌面触达</text><text x="446" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">从应用入口启动</text><text x="446" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">完成提醒与结果打开</text><rect x="802" y="137" width="356" height="214" rx="22" fill="#fff2e8" stroke="none"/><g transform="translate(824 159)" fill="none" stroke="#bc693b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 14 19-9 19 9v23l-19 9-19-9Zm0 0 19 10 19-10M24 24v22M15 9l19 10"/></g><text x="886" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">原生 .deb 交付</text><text x="826" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">封装程序、题库与依赖</text><text x="826" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">按版本部署与复查</text><rect x="42" y="375" width="356" height="214" rx="22" fill="#f3edfb" stroke="none"/><g transform="translate(64 397)" fill="none" stroke="#8660af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="16" y="3" width="16" height="12" rx="3"/><rect x="2" y="33" width="16" height="12" rx="3"/><rect x="30" y="33" width="16" height="12" rx="3"/><path d="M24 15v10H10v8M24 25h14v8"/></g><text x="126" y="429" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">本机与 SSH</text><text x="66" y="488" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">直接在麒麟上测试</text><text x="66" y="523" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">也可从另一台电脑管理</text><rect x="422" y="375" width="356" height="214" rx="22" fill="#eaf6fc" stroke="none"/><g transform="translate(444 397)" fill="none" stroke="#3282a5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="38" height="27" rx="4"/><path d="M24 34v9M14 43h20M12 15h15M12 22h24"/></g><text x="506" y="429" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">系统事件检查</text><text x="446" y="488" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">重启、权限与网络变化</text><text x="446" y="523" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">在目标环境单独验证</text><rect x="802" y="375" width="356" height="214" rx="22" fill="#fff7df" stroke="none"/><g transform="translate(824 397)" fill="none" stroke="#a17822" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M39 18A16 16 0 0 0 10 14L6 20m0-10v10h10M9 30a16 16 0 0 0 29 4l4-6m0 10V28H32"/></g><text x="886" y="429" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">固定试卷回归</text><text x="826" y="488" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">保留题目与内容指纹</text><text x="826" y="523" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">升级后重复检查</text></g></svg>
