<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="379" viewBox="0 0 1200 379" role="img" aria-labelledby="title"><title id="title">把评测放进真实使用场景</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8592a7"/></marker></defs><rect width="1200" height="379" rx="24" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="34" fill="#23304a" font-weight="700" text-anchor="start">把评测放进真实使用场景</text><text x="42" y="100" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">从个人助理选型，到团队定位问题与版本回归。</text><rect x="42" y="137" width="356" height="214" rx="22" fill="#edf2ff" stroke="none"/><g transform="translate(64 159)" fill="none" stroke="#5264ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="13"/><path d="m31 31 11 11M15 21h12"/></g><text x="126" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">选择合适的助理</text><text x="66" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">围绕同一份固定试卷</text><text x="66" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">观察各项能力与证据</text><rect x="422" y="137" width="356" height="214" rx="22" fill="#e9f7f2" stroke="none"/><g transform="translate(444 159)" fill="none" stroke="#22836f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4h18l10 10v30H11ZM29 4v12h10M18 25h14M18 33h14"/></g><text x="506" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">定位记忆问题</text><text x="446" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">追查旧约定、串台和遗漏</text><text x="446" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">对照回答与实际产物</text><rect x="802" y="137" width="356" height="214" rx="22" fill="#fff2e8" stroke="none"/><g transform="translate(824 159)" fill="none" stroke="#bc693b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M39 18A16 16 0 0 0 10 14L6 20m0-10v10h10M9 30a16 16 0 0 0 29 4l4-6m0 10V28H32"/></g><text x="886" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">检查版本变化</text><text x="826" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">升级前后复用试卷</text><text x="826" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">复查修复与历史问题</text></g></svg>
