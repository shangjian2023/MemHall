<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535" role="img" aria-labelledby="title"><title id="title">智能体接入生态</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8592a7"/></marker></defs><rect width="1200" height="535" rx="24" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="34" fill="#23304a" font-weight="700" text-anchor="start">同一条评测链路，连接不同智能体</text><text x="42" y="100" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">已接入的四款智能体，共用试卷、评分与证据格式。</text><rect x="42" y="140" width="252" height="82" rx="22" fill="#edf2ff" stroke="none"/><text x="168" y="190" font-size="28" fill="#5264ce" font-weight="700" text-anchor="middle">Hermes</text><path d="M168 223V263" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="330" y="140" width="252" height="82" rx="22" fill="#e9f7f2" stroke="none"/><text x="456" y="190" font-size="28" fill="#22836f" font-weight="700" text-anchor="middle">kylin-agent</text><path d="M456 223V263" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="618" y="140" width="252" height="82" rx="22" fill="#fff2e8" stroke="none"/><text x="744" y="190" font-size="28" fill="#bc693b" font-weight="700" text-anchor="middle">KylinBot</text><path d="M744 223V263" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="906" y="140" width="252" height="82" rx="22" fill="#f3edfb" stroke="none"/><text x="1032" y="190" font-size="28" fill="#8660af" font-weight="700" text-anchor="middle">OpenClaw</text><path d="M1032 223V263" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="277" width="1116" height="92" rx="22" fill="#25334e" stroke="none"/><text x="600" y="332" font-size="30" fill="#ffffff" font-weight="700" text-anchor="midd