<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="606" viewBox="0 0 1200 606" role="img" aria-labelledby="title"><title id="title">评测架构</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8592a7"/></marker></defs><rect width="1200" height="606" rx="24" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="34" fill="#23304a" font-weight="700" text-anchor="start">从题目到报告，一条链路可以追溯</text><text x="42" y="100" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">统一入口负责执行，判卷按检查类型选择，原始证据随结果保留。</text><rect x="42" y="142" width="350" height="150" rx="22" fill="#edf2ff" stroke="none"/><g transform="translate(65 165)" fill="none" stroke="#5264ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4h18l10 10v30H11ZM29 4v12h10M18 25h14M18 33h14"/></g><text x="130" y="192" font-size="29" fill="#23304a" font-weight="700" text-anchor="start">题库与试卷</text><text x="66" y="255" font-size="24" fill="#58677b" font-weight="400" text-anchor="start">固定任务 · 场景扩展</text><path d="M395 217H419" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="424" y="142" width="350" height="150" rx="22" fill="#e9f7f2" stroke="none"/><g transform="translate(447 165)" fill="none" stroke="#22836f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="5"/><path d="m12 17 7 7-7 7M26 31h10"/></g><text x="512" y="192" font-size="29" fill="#23304a" font-weight="700" text-anchor="start">智能体执行</text><text x="448" y="255" font-size="24" fill="#58677b" font-weight="400" text-anchor="start">教 → 隔 → 考</text><path d="M777 217H801" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="806" y="142" width="350" height="150" rx="22" fill="#fff2e8" stroke="none"/><g transform="translate(829 165)" fill="none" stroke="#bc693b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14h15l5 6h18v21H5ZM5 14V8h15l5 6h18v6"/><path d="m18 30 5 5 10-11"/></g><text x="894" y="192" font-size="29" fill="#23304a" font-weight="700" text-anchor="start">证据采集</text><text x="830" y="255" font-size="24" fill="#58677b" font-weight="400" text-anchor="start">对话 · 行动 · 文件</text><path d="M981 293V328" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="342" width="1116" height="90" rx="22" fill="#f0edf8" stroke="none"/><text x="77" y="398" font-size="29" fill="#715898" font-weight="700" text-anchor="start">判卷与解释</text><text x="323" y="398" font-size="26" fill="#23304a" font-weight="400" text-anchor="start">规则检查文件等确定条件   /   LLM 评估语义回答</text><path d="M600 433V469" fill="none" stroke="#8592a7" stroke-width="3" marker-end="url(#arrow)"/><rect x="42" y="482" width="1116" height="90" rx="22" fill="#eaf5f2" stroke="none"/><text x="77" y="538" font-size="29" fill="#247c68" font-weight="700" text-anchor="start">报告与复查</text><text x="323" y="538" font-size="26" fill="#23304a" font-weight="400" text-anchor="start">六维画像   ·   逐题判定   ·   原始证据   ·   归档核验</text></g></svg>
