<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="585" viewBox="0 0 1200 585" role="img" aria-labelledby="title"><title id="title">目录更新真实案例：回答与行动双侧检查</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8592a7"/></marker></defs><rect width="1200" height="585" rx="24" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="34" fill="#23304a" font-weight="700" text-anchor="start">真实案例：改过目录，后续是否真的用新目录？</text><text x="42" y="100" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">kylin-agent · update-001 · 20261015-115547 归档</text><rect x="42" y="143" width="1116" height="94" rx="22" fill="#edf2ff" stroke="none"/><text x="68" y="184" font-size="25" fill="#5264ce" font-weight="700" text-anchor="start">教学要求</text><text x="252" y="184" font-size="29" fill="#23304a" font-weight="700" text-anchor="start">旧约定  ~/work/src    →    新约定  ~/dev/src</text><text x="252" y="218" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">加入干扰、切换会话后，再提问并要求创建 demo 目录。</text><rect x="42" y="268" width="546" height="185" rx="22" fill="#fff2e8" stroke="none"/><g transform="translate(66 290)" fill="none" stroke="#b97146" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4h18l10 10v30H11ZM29 4v12h10M18 25h14M18 33h14"/></g><text x="133" y="326" font-size="29" fill="#23304a" font-weight="700" text-anchor="start">回答检查</text><text x="68" y="380" font-size="25" fill="#58677b" font-weight="400" text-anchor="start">后续仍回答旧路径</text><text x="68" y="417" font-size="25" fill="#58677b" font-weight="400" text-anchor="start">~/work/src</text><rect x="612" y="268" width="546" height="185" rx="22" fill="#fff2e8" stroke="none"/><g transform="translate(636 290)" fill="none" stroke="#b97146" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14h15l5 6h18v21H5ZM5 14V8h15l5 6h18v6"/><path d="m18 30 5 5 10-11"/></g><text x="703" y="326" font-size="29" fill="#23304a" font-weight="700" text-anchor="start">行动检查</text><text x="638" y="380" font-size="25" fill="#58677b" font-weight="400" text-anchor="start">demo 实际出现在旧目录</text><text x="638" y="417" font-size="25" fill="#58677b" font-weight="400" text-anchor="start">/home/okim/work/src/demo</text><rect x="42" y="483" width="1116" height="72" rx="22" fill="#25334e" stroke="none"/><text x="600" y="528" font-size="28" fill="#ffffff" font-weight="700" text-anchor="middle">回答与行动分开检查，才能看清问题发生在哪里。</text></g></svg>
