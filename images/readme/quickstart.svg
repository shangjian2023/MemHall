<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="379" viewBox="0 0 1200 379" role="img" aria-labelledby="title"><title id="title">三步，先体验完整流程</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8592a7"/></marker></defs><rect width="1200" height="379" rx="24" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="34" fill="#23304a" font-weight="700" text-anchor="start">三步，先体验完整流程</text><text x="42" y="100" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">使用 mock 模拟适配器，无需调用真实模型。</text><rect x="42" y="137" width="356" height="214" rx="22" fill="#edf2ff" stroke="none"/><g transform="translate(64 159)" fill="none" stroke="#5264ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="40" height="34" rx="5"/><path d="m12 17 7 7-7 7M26 31h10"/></g><text x="126" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">01  准备环境</text><text x="66" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">安装固定依赖</text><text x="66" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">doctor 检查运行条件</text><rect x="422" y="137" width="356" height="214" rx="22" fill="#e9f7f2" stroke="none"/><g transform="translate(444 159)" fill="none" stroke="#22836f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M39 18A16 16 0 0 0 10 14L6 20m0-10v10h10M9 30a16 16 0 0 0 29 4l4-6m0 10V28H32"/></g><text x="506" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">02  跑通模拟</text><text x="446" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">运行 quick 题包</text><text x="446" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">体验采集、判卷与归档</text><rect x="802" y="137" width="356" height="214" rx="22" fill="#fff2e8" stroke="none"/><g transform="translate(824 159)" fill="none" stroke="#bc693b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="7" width="38" height="27" rx="4"/><path d="M24 34v9M14 43h20M12 15h15M12 22h24"/></g><text x="886" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">03  打开报告</text><text x="826" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">verify 核查归档</text><text x="826" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">在界面查看逐题结果</text></g></svg>
