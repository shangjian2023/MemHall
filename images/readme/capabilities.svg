<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617" viewBox="0 0 1200 617" role="img" aria-labelledby="title"><title id="title">六项能力，看清记忆的不同侧面</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#8592a7"/></marker></defs><rect width="1200" height="617" rx="24" fill="#ffffff"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="42" y="58" font-size="34" fill="#23304a" font-weight="700" text-anchor="start">六项能力，看清记忆的不同侧面</text><text x="42" y="100" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">从记住信息，到更新约定，再到真正办对事情。</text><rect x="42" y="137" width="356" height="214" rx="22" fill="#edf2ff" stroke="none"/><g transform="translate(64 159)" fill="none" stroke="#5264ce" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="18"/><path d="M24 12v13l9 5"/></g><text x="126" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">长期保持</text><text x="66" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">经历后续交互</text><text x="66" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">原有信息还能用吗？</text><rect x="422" y="137" width="356" height="214" rx="22" fill="#e9f7f2" stroke="none"/><g transform="translate(444 159)" fill="none" stroke="#22836f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="21" cy="21" r="13"/><path d="m31 31 11 11M15 21h12"/></g><text x="506" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">记忆调用</text><text x="446" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">任务需要时</text><text x="446" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">能找到相关约定吗？</text><rect x="802" y="137" width="356" height="214" rx="22" fill="#fff2e8" stroke="none"/><g transform="translate(824 159)" fill="none" stroke="#bc693b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M39 18A16 16 0 0 0 10 14L6 20m0-10v10h10M9 30a16 16 0 0 0 29 4l4-6m0 10V28H32"/></g><text x="886" y="191" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">动态更新</text><text x="826" y="250" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">用户修改约定</text><text x="826" y="285" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">旧信息会随之更新吗？</text><rect x="42" y="375" width="356" height="214" rx="22" fill="#f3edfb" stroke="none"/><g transform="translate(64 397)" fill="none" stroke="#8660af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="9" width="14" height="29" rx="4"/><rect x="29" y="9" width="14" height="29" rx="4"/><path d="M24 6v36" stroke-dasharray="3 5"/></g><text x="126" y="429" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">相近区分</text><text x="66" y="488" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">相似项目与人物</text><text x="66" y="523" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">会被混在一起吗？</text><rect x="422" y="375" width="356" height="214" rx="22" fill="#eaf6fc" stroke="none"/><g transform="translate(444 397)" fill="none" stroke="#3282a5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m24 5 16 6v13c0 10-16 19-16 19S8 34 8 24V11Z"/><path d="m16 24 6 6 11-13"/></g><text x="506" y="429" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">边界识别</text><text x="446" y="488" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">明确不应保留的信息</text><text x="446" y="523" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">会被继续使用吗？</text><rect x="802" y="375" width="356" height="214" rx="22" fill="#fff7df" stroke="none"/><g transform="translate(824 397)" fill="none" stroke="#a17822" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14h15l5 6h18v21H5ZM5 14V8h15l5 6h18v6"/><path d="m18 30 5 5 10-11"/></g><text x="886" y="429" font-size="28" fill="#23304a" font-weight="700" text-anchor="start">任务复用</text><text x="826" y="488" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">记住的信息</text><text x="826" y="523" font-size="23" fill="#58677b" font-weight="400" text-anchor="start">会落实到文件与行动吗？</text></g></svg>
