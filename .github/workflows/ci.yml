# CI 门禁：题库 lint + 全量测试。
# 对应两类高频事故：数据侧（schema/防污染/覆盖矩阵/离线可判）与代码侧（e2e/适配器回归）。
# 平台矩阵 = Tier 2 证据：Tier 1 openKylin 的真机 systest（重启/拨钟/断网）在 VM 侧跑，
# GitHub 没有 openKylin runner，其证据链在 runs/ 产物与 systest 报告。
name: CI

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

env:
  # Windows runner 控制台默认 GBK，lint 打印 ⚠ / 报告路径会 UnicodeEncodeError
  PYTHONIOENCODING: utf-8
  # CI 走官方 PyPI：清华镜像对 GitHub runner IP 限流，uv sync 曾 403 抖动（2026-10-12）；
  # 本地中国网络照旧走 pyproject 里的清华 index（此 env 只进 CI）
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --dev --frozen
      - name: 治理文档与链接检查
        run: uv run python scripts/check_governance.py
      - name: 运行依赖版本与许可资料
        run: uv run python scripts/dependency_inventory.py --output build/compliance --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-dependency-licenses-linux-py312
          path: build/compliance/
          if-no-files-found: error

  lint:
    # 静态门禁：ruff（语法/惯用法，P0 期间靠它逮到过真 NameError）+ mypy（宽松档）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: 安装依赖（uv sync，--frozen 严格走 lockfile）
        run: uv sync --dev --frozen

      - name: ruff 检查（E/F/W/I/B/UP/SIM/RET）
        run: uv run ruff check .

      - name: mypy 类型检查（src，宽松档）
        run: uv run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = Windows 开发环境；3.12 = openKylin 3.0 目标机
        python-version: ["3.11", "3.12"]
        # Windows = 开发/评测宿主；ubuntu = Tier 1 openKylin(Debian 系) 的代理验证
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装依赖（uv sync，--frozen 严格走 lockfile）
        run: uv sync --dev --frozen

      - name: 题库门禁 lint_cases.py
        run: uv run python scripts/lint_cases.py

      - name: 判卷离线自检（ScriptedJudge × 金标准，错判零容忍）
        run: uv run python scripts/judge_selftest.py --offline

      - name: 测试套件
        run: uv run pytest tests/ -q

  release:
    # T23：tag（v*）触发——Windows runner 出 exe 双发行物挂 GitHub Release；
    # deb 是 openKylin 目标机原生构建物（build_deb_vm.sh），不走 CI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, governance]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（uv sync，--frozen 严格走 lockfile）
        run: uv sync --dev --frozen

      - name: 打包 exe（onedir 压缩 + 单文件）
        shell: bash
        run: |
          bash scripts/build_exe.sh
          tar -a -cf dist/MemHall-windows-onedir.zip -C dist MemHall
          uv run python scripts/release_checksums.py --output build/windows-release-checks \
            "dist/麟阁MemHall-单文件版.exe" dist/MemHall-windows-onedir.zip \
            dist/THIRD_PARTY_LICENSES-windows.zip
          cp build/windows-release-checks/SHA256SUMS.txt dist/SHA256SUMS-windows.txt
          cp build/windows-release-checks/release-manifest.json dist/release-manifest-windows.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/麟阁MemHall-单文件版.exe
            dist/MemHall-windows-onedir.zip
            dist/THIRD_PARTY_LICENSES-windows.zip
            dist/SHA256SUMS-windows.txt
            dist/release-manifest-windows.json
