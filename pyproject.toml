[project]
name = "memhall"
version = "1.3.1"
description = "麟阁 MemHall —— 面向 openKylin 生态的智能体记忆能力评测基准"
authors = [{ name = "MemHall Team" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# 平台分级声明：Tier 1 = openKylin 3.0（真机 systest + .deb）；Tier 2 = 主流 Linux/Windows（CI 矩阵）
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "pywebview>=5.0; sys_platform == 'win32'",
    "httpx>=0.28.1",
]

[project.scripts]
memhall = "memhall.cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = []

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "paramiko>=5.0.0",
    "pytest>=9.1.1",
    "pyinstaller>=6.10",
    "ruff>=0.16.10",
    "mypy>=2.4.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["okim-bench"]  # W1 归档原型，不再演进

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes（未用导入/未定义名——P0 期间靠它逮到过真 NameError）
    "W",   # pycodestyle warnings
    "I",   # import 排序
    "B",   # bugbear（常见坑）
    "UP",  # pyupgrade（现代语法）
    "SIM", # 简化惯用法
    "RET", # return 链简化
]
ignore = [
    "UP042", # str-Enum → StrEnum：schema 表示层不动，零收益纯 churn
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
